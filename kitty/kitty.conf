# Font configuration
font_family      JetBrainsMono Nerd Font
font_size 18.7

# Window layout
initial_window_width  82c
initial_window_height 24c
window_padding_width 30

# Window decorations
hide_window_decorations no

# Background opacity
#background_opacity 0.9

# Cursor - solid black block for e-ink aesthetic
cursor_shape block
cursor_blink_interval 0


# Terminal identification
term xterm-kitty

# Performance tweaks for smooth rendering
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Disable bell
enable_audio_bell no

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select yes
strip_trailing_spaces smart

# URL handling
url_color #4A4A4A
url_style single

confirm_os_window_close 0

# The basic colors
foreground              #56C96E
background              #0b0b0b
selection_foreground    #3E3545
selection_background    #56C96E

# Cursor colors
cursor                  #5497AB
cursor_text_color       #3E3545

# URL underline color when hovering with mouse
url_color               #5497AB

# Kitty window border colors
active_border_color     #56C96E
inactive_border_color   #219062
bell_border_color       #5497AB

# Tab bar colors
active_tab_foreground   #3E3545
active_tab_background   #56C96E
inactive_tab_foreground #56C96E
inactive_tab_background #3E3545
tab_bar_background      #3E3545

# Colors for marks (marked text in the terminal)
mark1_foreground #3E3545
mark1_background #5497AB
mark2_foreground #3E3545
mark2_background #56C96E
mark3_foreground #3E3545
mark3_background #299B51

